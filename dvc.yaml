stages:
  mllam_version:
    cmd: source machines/environment.sh; python -c "from neural_lam import __version__; print(__version__)" > version.mllam.txt
  prepare_dataset:
    cmd: python -m mllam_data_prep data/datastore.yaml --output data/datastore.zarr
    deps:
    - data/datastore.yaml
    outs:
    - data/datastore.zarr
  create_graph:
    cmd: python -m neural_lam.build_triangular_graph --config_path data/config.yaml --graph_name triangular --g2m_radius 1.5  --splits 8 --plot
    params:
    - data/config.yaml:
      - datastore
    deps:
    - data/datastore.zarr
    outs:
    - data/graph/
  train:
    cmd:
    - python -m neural_lam.train_model --logger mlflow --logger_project has_hidden_dim --config_path ./data/config.yaml --model graph_lam --graph triangular --epochs 1 --batch_size 1 --ar_steps_eval 1 --ar_steps_train 2 --plot_vars t_2m --val_steps_to_log 1 --eval_init_times --num_sanity_steps 0
    params:
    - data/training_params.yaml:
      - model
      - graph
      - epochs
      - batch_size
      - hidden_dim
      - processor_layers
      - metrics_watch
      - num_workers
      - num_nodes
      - val_steps_to_log
    deps:
    - version.mllam.txt
    - data/graph/
    - data/config.yaml
    - data/datastore.yaml
    outs:
    - saved_models
  evaluate:
    cmd:
    - sbatch -W --nodes 1 machines/slurm.train.sh --config_path ./data/config.yaml --eval val --load
      ./saved_models/*/last.ckpt --logger mlflow --logger_project has_hidden_dim
    params:
    - data/evaluate_params.yaml:
      - model
      - graph
      - epochs
      - batch_size
      - hidden_dim
      - num_workers
      - processor_layers
      - metrics_watch
      - val_steps_to_log
      - num_nodes
      - ar_steps_eval
    deps:
    - version.mllam.txt
    - data/graph/
    - data/config.yaml
    - data/datastore.yaml
    - saved_models
    outs:
    - mlruns
