# dvc parameters listed under `vars` will not be tracked
#  which is used to list settings that do not affect the
#  training or evaluation of the model, e.g. which logger
#  has been used.
vars:
  - logger: mlflow
stages:
  check_for_venv_path:
    cmd: machines/check_for_venv_path.sh
  mllam_version:
    cmd: '$MLLAM_VENV_PATH/bin/python -c "from neural_lam import __version__; print(__version__)" > version.mllam.txt'
  create_lsm_dataset:
    cmd: '$MLLAM_VENV_PATH/bin/python src/create_state_dataset.py --input /dcai/projects/cu_0003/data/sources/icon/ICON312_v1.0.0.zarr --output /dcai/projects/cu_0003/data/sources/icon/ICON312_lsm.zarr; touch data/semaphore.lsm.created'
    outs:
    - data/semaphore.lsm.created
  prepare_dataset:
    cmd: export DVC_WORKING_DIR=$(pwd); sbatch -W --chdir ~/logs machines/slurm.mllam-data-prep.sh data/datastore.yaml --output data/datastore.zarr
    deps:
    - data/datastore.yaml
    - data/semaphore.lsm.created
    outs:
    - data/datastore.zarr
  prepare_boundary_dataset:
    cmd: export DVC_WORKING_DIR=$(pwd); sbatch -W --chdir ~/logs machines/slurm.mllam-data-prep.sh data/datastore.cropped.yaml --output data/datastore.cropped.zarr
    deps:
    - data/datastore.cropped.yaml
    outs:
    - data/datastore.cropped.zarr
  create_graph:
    cmd: '$MLLAM_VENV_PATH/bin/python -m neural_lam.build_triangular_graph --config_path data/config.yaml --graph_name triangular --g2m_radius 1.5  --splits 8 --plot ${graph-defaults}'
    params:
    - data/config.yaml:
      - datastore
    - data/datastore.yaml:
      - inputs.icon_merged.path
      - inputs.icon_merged.coord_ranges.cell
    outs:
    - data/graph/
  train:
    cmd:
    - export DVC_WORKING_DIR=$(pwd); sbatch -W ${slurm-defaults} --chdir ~/logs machines/slurm.neural-lam.sh --config_path ./data/config.yaml --logger ${logger} --logger-project ${logger-project} ${baseline-defaults}
    deps:
    - version.mllam.txt
    - data/graph/
    - data/config.yaml
    - data/datastore.yaml
    outs:
    - saved_models
  evaluate:
    cmd:
    - export DVC_WORKING_DIR=$(pwd); sbatch -W ${slurm-eval} --chdir ~/logs machines/slurm.neural-lam.sh --config_path ./data/config.yaml --eval val --load
      ./saved_models/*/last.ckpt --logger ${logger} --logger-project ${logger-project} ${baseline-eval}
    deps:
    - version.mllam.txt
    - data/graph/
    - data/config.yaml
    - data/datastore.yaml
    - saved_models
    outs:
    - mlruns
