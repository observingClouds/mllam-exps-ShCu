dataset_version: v1.0.0
extra:
  projection:
    class_name: LambertConformal
    kwargs:
      central_longitude: -57.82988033758235
      central_latitude: 13.599319931930872
      standard_parallels:
        - 13.599319931930872
        - 13.599319931930872
      globe:
        semimajor_axis: 6367470.0
        semiminor_axis: 6367470.0
inputs:
  icon_merged:
    coord_ranges:
      cell: None
    dim_mapping:
      grid_index:
        dim: cell
        method: rename
      state_feature:
        method: stack_variables_by_var_name
        name_format: '{var_name}'
      time:
        dim: time
        method: rename
    dims:
    - time
    - cell
    path: /home/has/data/sources/icon/ICON312_v1.0.0.zarr
    target_output_variable: state
    variables:
    - t_2m
    - u_10m
    - v_10m
    - pres_sfc
    - qv_2m
    - tqc_dia
  static_features:
    coord_ranges:
      cell: None
    dim_mapping:
      grid_index:
        dim: cell
        method: rename
      static_feature:
        method: stack_variables_by_var_name
        name_format: '{var_name}'
    dims:
    - cell
    path: /home/has/data/sources/icon/ICON312_lsm.zarr
    target_output_variable: static
    variables:
    - lsm
  forcing_features:
    path: /home/has/data/sources/icon/ICON312_v1.0.0.zarr
    dims: [time, cell]
    coord_ranges:
      cell: None
    variables: [t_seasfc]
    derived_variables:
      toa_radiation:
        kwargs:
          time: ds_input.time
          lat: ds_input.clat
          lon: ds_input.clon
        function: mllam-exps-ShCu.src.custom_mdp_funcs.compute_toa_radiation_radians
      hour_of_day_sin:
        kwargs:
          time: ds_input.time
          component: sin
        function: mllam_data_prep.ops.derive_variable.time_components.calculate_hour_of_day
      hour_of_day_cos:
        kwargs:
          time: ds_input.time
          component: cos
        function: mllam_data_prep.ops.derive_variable.time_components.calculate_hour_of_day
    dim_mapping:
      time:
        dim: time
        method: rename
      grid_index:
        dim: cell
        method: rename
      forcing_feature:
        method: stack_variables_by_var_name
        name_format: "{var_name}"
    target_output_variable: forcing
output:
  chunking:
    time: 1
    state_feature: 1
  splitting:
    dim: time
    splits:
      test:
        start: 2020-02-01T00:00
        end: 2020-02-12T00:00
      train:
        compute_statistics:
          dims:
          - grid_index
          - time
          ops:
          - mean
          - std
          - diff_mean
          - diff_std
        end: 2020-01-31T10:00
        start: 2020-01-11T23:00
      val:
        end: 2020-02-19T10:00
        start: 2020-02-12T00:00
  variables:
    state:
    - time
    - grid_index
    - state_feature
    static:
    - grid_index
    - static_feature
    forcing:
    - time
    - grid_index
    - forcing_feature
schema_version: v0.6.0
