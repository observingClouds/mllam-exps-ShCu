schema: '2.0'
stages:
  check_for_venv_path:
    cmd: machines/check_for_venv_path.sh
  mllam_version:
    cmd: $MLLAM_VENV_PATH/bin/python -c "from neural_lam import __version__; print(__version__)"
      > version.mllam.txt
  prepare_dataset:
    cmd: export DVC_WORKING_DIR=$(pwd); sbatch -W --chdir ~/logs machines/slurm.mllam-data-prep.sh
      data/datastore.yaml --output data/datastore.zarr
    deps:
    - path: data/datastore.yaml
      hash: md5
      md5: c5df825f4368eb5c4eda15480a289bb5
      size: 8390306
      isexec: true
    - path: data/semaphore.lsm.created
      hash: md5
      md5: d41d8cd98f00b204e9800998ecf8427e
      size: 0
    outs:
    - path: data/datastore.zarr
      hash: md5
      md5: 0b875c3b6379cc63504458f4046b1192.dir
      size: 13831565683
      nfiles: 5630
  create_graph:
    cmd: $MLLAM_VENV_PATH/bin/python -m neural_lam.build_triangular_graph --config_path
      data/config.yaml --graph_name triangular --g2m_radius 1.5  --splits 8 --plot
      --splits 12 --g2m_radius 1.5 --rotate_ico --plot --graph_name triangular
    deps:
    - path: data/datastore.zarr
      hash: md5
      md5: 0b875c3b6379cc63504458f4046b1192.dir
      size: 13831565683
      nfiles: 5630
    params:
      data/config.yaml:
        datastore:
          kind: mdp
          config_path: ../data/datastore.yaml
    outs:
    - path: data/graph/
      hash: md5
      md5: f8c994b0f79d96cd0cf8185d4168d43c.dir
      size: 193587284
      nfiles: 9
  create_lsm_dataset:
    cmd: $MLLAM_VENV_PATH/bin/python src/create_state_dataset.py --input /dcai/projects/cu_0003/data/sources/icon/ICON312_v1.0.0.zarr
      --output /dcai/projects/cu_0003/data/sources/icon/ICON312_lsm.zarr; touch data/semaphore.lsm.created
    outs:
    - path: data/semaphore.lsm.created
      hash: md5
      md5: d41d8cd98f00b204e9800998ecf8427e
      size: 0
  train:
    cmd:
    - export DVC_WORKING_DIR=$(pwd); sbatch -W --job-name has/LES/dev --time 1-00:00:00
      --nodes 2 --ntasks-per-node 8 --gres gpu:8 --no-requeue --exclusive --account
      cu_0003 --chdir ~/logs machines/slurm.neural-lam.sh --config_path ./data/config.yaml
      --logger mlflow --logger-project has/LES/dev --num_workers 8 --batch_size 1
      --hidden_dim 32 --precision bf16-mixed --processor_layers 4 --model graph_lam
      --graph triangular --epochs 1 --ar_steps_train 2 --lr 0.001 --val_interval 1
      --ar_steps_eval 2 --val_steps_to_log 1 2 --num_sanity_steps 0 --eval_init_times
      --plot_vars t_2m u_10m v_10m pres_sfc synsat_rttov_forward_model_2__abi_ir__goes_16__channel_7
      --metrics_watch 'val_rmse, mse, random_metric' --num_nodes 2
    deps:
    - path: data/config.yaml
      hash: md5
      md5: 20d97bfb85f27553e03d8662a5c73a2b
      size: 143
      isexec: true
    - path: data/datastore.yaml
      hash: md5
      md5: c5df825f4368eb5c4eda15480a289bb5
      size: 8390306
      isexec: true
    - path: data/graph/
      hash: md5
      md5: f8c994b0f79d96cd0cf8185d4168d43c.dir
      size: 193587284
      nfiles: 9
    - path: version.mllam.txt
      hash: md5
      md5: d03a8d7953fe639d93c5d57409e9b956
      size: 30
      isexec: true
    outs:
    - path: saved_models
      hash: md5
      md5: 30bee5a05e5a2d12ceee96f77f7419cb.dir
      size: 2477120
      nfiles: 3
  evaluate:
    cmd:
    - export DVC_WORKING_DIR=$(pwd); sbatch -W --job-name has/LES/dev --time 1-00:00:00
      --nodes 1 --ntasks-per-node 8 --gres gpu:8 --no-requeue --exclusive --account
      cu_0003 --chdir ~/logs machines/slurm.neural-lam.sh --config_path ./data/config.yaml
      --eval val --load ./saved_models/*/last.ckpt --logger mlflow --logger-project
      has/LES/dev --num_workers 8 --batch_size 1 --hidden_dim 32 --precision bf16-mixed
      --processor_layers 4 --model graph_lam --graph triangular --epochs 1 --ar_steps_train
      2 --lr 0.001 --val_interval 1 --ar_steps_eval 2 --val_steps_to_log 1 2 --num_sanity_steps
      0 --eval_init_times --plot_vars t_2m u_10m v_10m pres_sfc synsat_rttov_forward_model_2__abi_ir__goes_16__channel_7
      --metrics_watch 'val_rmse, mse, random_metric' --num_nodes 1
    deps:
    - path: data/config.yaml
      hash: md5
      md5: 20d97bfb85f27553e03d8662a5c73a2b
      size: 143
      isexec: true
    - path: data/datastore.yaml
      hash: md5
      md5: c5df825f4368eb5c4eda15480a289bb5
      size: 8390306
      isexec: true
    - path: data/graph/
      hash: md5
      md5: f8c994b0f79d96cd0cf8185d4168d43c.dir
      size: 193587284
      nfiles: 9
    - path: saved_models
      hash: md5
      md5: 30bee5a05e5a2d12ceee96f77f7419cb.dir
      size: 2477120
      nfiles: 3
    - path: version.mllam.txt
      hash: md5
      md5: d03a8d7953fe639d93c5d57409e9b956
      size: 30
      isexec: true
    outs:
    - path: mlruns
      hash: md5
      md5: e183d55c1ae64ae06bdf29cdc6e72599.dir
      size: 68017099
      nfiles: 24
