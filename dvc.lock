schema: '2.0'
stages:
  check_for_venv_path:
    cmd: machines/check_for_venv_path.sh
  mllam_version:
    cmd: $MLLAM_VENV_PATH/bin/python -c "from neural_lam import __version__; 
      print(__version__)" > version.mllam.txt
  create_lsm_dataset:
    cmd: $MLLAM_VENV_PATH/bin/python src/create_state_dataset.py --input 
      /home/has/data//sources/icon/ICON312_v1.0.0.zarr --output 
      /home/has/data//sources/icon/ICON312_lsm.zarr; touch 
      data/semaphore.lsm.created
    outs:
    - path: data/semaphore.lsm.created
      hash: md5
      md5: d41d8cd98f00b204e9800998ecf8427e
      size: 0
  split_dataset:
    cmd: $MLLAM_VENV_PATH/bin/python -m neural_lam.split_datastore 
      --source_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.cropped.yaml
      --interior_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.interior.yaml
      --boundary_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.boundary.yaml
    deps:
    - path: data/datastore.cropped.yaml
      hash: md5
      md5: 23d8dea9707bb93db56fe9359eae0913
      size: 8390583
    outs:
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: dd9c71744f4809991c1b8d03d35fa421
      size: 18876913
    - path: data/datastore.interior.yaml
      hash: md5
      md5: ebf2956648478d7d85fab5765f600ade
      size: 15286117
  train:
    cmd:
    - export DVC_WORKING_DIR=$(pwd); bash machines/slurm.neural-lam.sh 
      --config_path ./data/config.yaml --logger mlflow --logger-project 
      has/LES/dev --num_workers 4 --batch_size 1 --hidden_dim 400 
      --hidden_dim_grid 200 --grad_checkpointing --precision bf16-mixed 
      --processor_layers 2 --model graph_lam --graph triangular2D_split13 
      --epochs 150 --ar_steps_train 12 --lr 0.001 --min_lr 0.001 --val_interval 
      5 --ar_steps_eval 10 --val_steps_to_log 1 2 3 4 5 6 7 10 
      --num_sanity_steps 1 --eval_init_times --plot_vars t_2m u_10m v_10m 
      pres_sfc --metrics_watch 'val_rmse, mse, random_metric' --num_nodes 1
    deps:
    - path: data/config.yaml
      hash: md5
      md5: e24d3be6fee8fdfa3e36d04e9065521f
      size: 290
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: f2a872652d64ea61c220e65ab839f3b2
      size: 2545
    - path: data/datastore.interior.yaml
      hash: md5
      md5: 57e63cbad43bd1d6979058e2636ede52
      size: 8391039
    - path: data/graph/
      hash: md5
      md5: 2bc275014aa56127c094f5e23eb22427.dir
      size: 665923286
      nfiles: 54
    - path: version.mllam.txt
      hash: md5
      md5: e704daffe4e36699770f5fd4bc16b5fa
      size: 20
    outs:
    - path: saved_models
      hash: md5
      md5: 7abc7f92403a75fac2b05691e79821b2.dir
      size: 155967918
      nfiles: 46
  evaluate:
    cmd:
    - LASTCHECKPT=./saved_models/train-glare-newt/; export 
      DVC_WORKING_DIR=$(pwd); bash machines/slurm.neural-lam.sh --config_path 
      ./data/config.yaml --eval val --load ${LASTCHECKPT}/last.ckpt --logger 
      mlflow --logger-project has/LES/dev --num_workers 4 --batch_size 1 
      --hidden_dim 400 --hidden_dim_grid 200 --grad_checkpointing --precision 
      bf16-mixed --processor_layers 2 --model graph_lam --graph 
      triangular2D_split13 --epochs 150 --ar_steps_train 12 --lr 0.001 --min_lr 
      0.001 --val_interval 5 --ar_steps_eval 10 --val_steps_to_log 1 2 3 4 5 6 7
      10 --num_sanity_steps 1 --eval_init_times --plot_vars t_2m u_10m v_10m 
      pres_sfc --metrics_watch 'val_rmse, mse, random_metric' --num_nodes 1
    deps:
    - path: data/config.yaml
      hash: md5
      md5: e24d3be6fee8fdfa3e36d04e9065521f
      size: 290
    - path: data/graph/
      hash: md5
      md5: 2bc275014aa56127c094f5e23eb22427.dir
      size: 665923286
      nfiles: 54
    - path: saved_models
      hash: md5
      md5: 7abc7f92403a75fac2b05691e79821b2.dir
      size: 155967918
      nfiles: 46
    - path: version.mllam.txt
      hash: md5
      md5: e704daffe4e36699770f5fd4bc16b5fa
      size: 20
    outs:
    - path: mlruns
      hash: md5
      md5: 489a38b95dcc9aac687b4dea8f332883.dir
      size: 353508687
      nfiles: 98
  create_graph:
    cmd: export DVC_WORKING_DIR=$(pwd); uv run python -m 
      neural_lam.build_triangular_graph --config_path data/config.yaml --splits 
      13 --g2m_radius 0.8 --g2m_radius_boundary 0.8 --rotate_ico 
      --two_dim_features --graph_name triangular2D_split13
    deps:
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: f2a872652d64ea61c220e65ab839f3b2
      size: 2545
    - path: data/datastore.interior.yaml
      hash: md5
      md5: 57e63cbad43bd1d6979058e2636ede52
      size: 8391039
    - path: data/semaphore.lsm.created
      hash: md5
      md5: d41d8cd98f00b204e9800998ecf8427e
      size: 0
    outs:
    - path: data/datastore.boundary.zarr
      hash: md5
      md5: d77643f89ca6a09f6d41a841029b3c1a.dir
      size: 12448839676
      nfiles: 5623
    - path: data/datastore.interior.zarr
      hash: md5
      md5: 1bbf517d479c1cc87940caf849ce63b8.dir
      size: 57925626628
      nfiles: 5621
    - path: data/graph/
      hash: md5
      md5: 2bc275014aa56127c094f5e23eb22427.dir
      size: 665923286
      nfiles: 54
  get_grid_information:
    cmd: $MLLAM_VENV_PATH/bin/python src/attach_grid.py
    outs:
    - path: data/grid.zarr
      hash: md5
      md5: 75339de88651f78f27758319b285c250.dir
      size: 334935821
      nfiles: 99
