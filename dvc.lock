schema: '2.0'
stages:
  check_for_venv_path:
    cmd: machines/check_for_venv_path.sh
  mllam_version:
    cmd: uv run --reinstall-package neural-lam --reinstall-package 
      mllam-data-prep python -c "from neural_lam import __version__; 
      print(__version__)" > version.mllam.txt; if grep -qi "dirty" 
      version.mllam.txt; then echo "version.mllam.txt contains dirty" >&2; fi
  create_lsm_dataset:
    cmd: uv run python src/create_state_dataset.py --input 
      /home/has/data//sources/icon/ICON312_v1.0.0.zarr --output 
      /home/has/data//sources/icon/ICON312_lsm.zarr; touch 
      data/semaphore.lsm.created
    deps:
    - path: src/create_state_dataset.py
      hash: md5
      md5: 8df2e88394035681bccaaecf404caf0d
      size: 1249
    outs:
    - path: data/semaphore.lsm.created
      hash: md5
      md5: d41d8cd98f00b204e9800998ecf8427e
      size: 0
  split_dataset:
    cmd: $MLLAM_VENV_PATH/bin/python -m neural_lam.split_datastore 
      --source_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.cropped.yaml
      --interior_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.interior.yaml
      --boundary_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.boundary.yaml
    deps:
    - path: data/datastore.cropped.yaml
      hash: md5
      md5: 23d8dea9707bb93db56fe9359eae0913
      size: 8390583
    outs:
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: dd9c71744f4809991c1b8d03d35fa421
      size: 18876913
    - path: data/datastore.interior.yaml
      hash: md5
      md5: ebf2956648478d7d85fab5765f600ade
      size: 15286117
  train:
    cmd:
    - export DVC_WORKING_DIR=$(pwd); sbatch -W --job-name 
      has/LES/hi_lam_200_ckptfalse --time 00:30:00 --nodes 1 --ntasks-per-node 4
      --gres gpu:4 --no-requeue --exclusive --mem 100GB --account deste_330_25 
      --partition boost_usr_prod --qos boost_qos_dbg --chdir ~/logs  
      machines/slurm.neural-lam.sh --config_paths $(python -c "import yaml; 
      d=yaml.safe_load(open('params.yaml'))['mllam-data-prep']['domains']; 
      print(','.join([f'./data/experiment/config/config.{k}.yaml' for k in 
      d]))") --logger mlflow --logger-project has/LES/hi_lam_200_ckptfalse 
      --num_workers 4 --batch_size 1 --hidden_dim 200 --hidden_dim_grid 200 
      --precision bf16-mixed --processor_layers 2 --model hi_lam --mesh_aggr 
      mean --seed 11 --epochs 50 --ar_steps_train 1 --num_future_boundary_steps 
      0 --num_past_boundary_steps 2 --lr 0.001 --min_lr 1e-05 --val_interval 5 
      --ar_steps_eval 5 --val_steps_to_log 1 2 3 4 5 --num_sanity_steps 1 
      --eval_init_times --plot_vars u_10m qv_2m --metrics_watch 'val_rmse, mse, 
      random_metric' --num_nodes 1 --graph_names $(python -c "import yaml; 
      params=yaml.safe_load(open('params.yaml')); 
      d=params['mllam-data-prep']['domains']; 
      splits=params['graph-defaults']['splits']; 
      print(','.join([f'triangular2D_split{splits}_{k}_hierarchical' for k in 
      d]))") --graph_dir data/graph
    deps:
    - path: data/experiment/
      hash: md5
      md5: 41338204fda40b1c8cb2f81e4e4759f1.dir
      size: 91880337674
      nfiles: 150011
    - path: data/graph/
      hash: md5
      md5: f51ff80ba6e9591b5aefe83c7d40a0c4.dir
      size: 383209404
      nfiles: 22
    - path: version.mllam.txt
      hash: md5
      md5: b413acdc846c6c2732c0844f55383e59
      size: 33
    params:
      params.yaml:
        baseline-defaults:
          num_workers: 4
          batch_size: 1
          hidden_dim: 200
          hidden_dim_grid: 200
          grad_checkpointing: false
          precision: bf16-mixed
          processor_layers: 2
          model: hi_lam
          mesh_aggr: mean
          seed: 11
          epochs: 50
          ar_steps_train: 1
          num_future_boundary_steps: 0
          num_past_boundary_steps: 2
          lr: 0.001
          min_lr: 1e-05
          val_interval: 5
          ar_steps_eval: 5
          val_steps_to_log:
          - 1
          - 2
          - 3
          - 4
          - 5
          restore_opt: false
          num_sanity_steps: 1
          eval_init_times: true
          plot_vars:
          - u_10m
          - qv_2m
          metrics_watch: val_rmse, mse, random_metric
          num_nodes: 1
    outs:
    - path: saved_models
      hash: md5
      md5: 4de8ffb349f286e1226781fb9a3f8ba7.dir
      size: 21009441273
      nfiles: 235
  evaluate:
    cmd:
    - LASTCHECKPT=./saved_models/train-genal-dohs/; export 
      DVC_WORKING_DIR=$(pwd); bash machines/slurm.neural-lam.sh --config_path 
      ./data/experiment/config/config.domain03.yaml --eval val --load 
      ${LASTCHECKPT}/last.ckpt --logger mlflow --logger-project 
      has/LES/hi_lam_200_ckptfalse --num_workers 4 --batch_size 1 --hidden_dim 
      200 --hidden_dim_grid 200 --precision bf16-mixed --processor_layers 2 
      --model hi_lam --mesh_aggr mean --seed 10 --epochs 50 --ar_steps_train 1 
      --num_future_boundary_steps 0 --num_past_boundary_steps 2 --lr 0.001 
      --min_lr 1e-05 --val_interval 5 --ar_steps_eval 5 --val_steps_to_log 1 2 3
      4 5 --num_sanity_steps 1 --eval_init_times --plot_vars u_10m qv_2m 
      --metrics_watch 'val_rmse, mse, random_metric' --num_nodes 1 --graph_names
      triangular2D_split13_domain03_hierarchical --graph_dir data/graph
    deps:
    - path: saved_models
      hash: md5
      md5: 4de8ffb349f286e1226781fb9a3f8ba7.dir
      size: 21009441273
      nfiles: 235
    outs:
    - path: mlruns
      hash: md5
      md5: d751713988987e9331980363e24189ce.dir
      size: 0
      nfiles: 0
  get_grid_information:
    cmd: $MLLAM_VENV_PATH/bin/python src/attach_grid.py
    outs:
    - path: data/grid.zarr
      hash: md5
      md5: 75339de88651f78f27758319b285c250.dir
      size: 334935821
      nfiles: 99
  create_domain_specific_datastores:
    cmd: uv run python src/create_datastores.py --domains domain03 
      --boundary-input-variables u_10m v_10m qv_2m tqc_dia t_2m lhfl_s shfl_s 
      rain_gsp_rate pres_sfc t_seasfc sob_t thb_t --interior-input-variables 
      u_10m v_10m qv_2m tqc_dia t_2m lhfl_s shfl_s rain_gsp_rate pres_sfc sob_t 
