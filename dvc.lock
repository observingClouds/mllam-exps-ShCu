schema: '2.0'
stages:
  check_for_venv_path:
    cmd: machines/check_for_venv_path.sh
  mllam_version:
    cmd: $MLLAM_VENV_PATH/bin/python -c "from neural_lam import __version__; print(__version__)"
      > version.mllam.txt
  create_lsm_dataset:
    cmd: $MLLAM_VENV_PATH/bin/python src/create_state_dataset.py --input /dcai/projects/cu_0003/data/sources/icon/ICON312_v1.0.0.zarr
      --output /dcai/projects/cu_0003/data/sources/icon/ICON312_lsm.zarr; touch data/semaphore.lsm.created
    outs:
    - path: data/semaphore.lsm.created
      hash: md5
      md5: d41d8cd98f00b204e9800998ecf8427e
      size: 0
  split_dataset:
    cmd: $MLLAM_VENV_PATH/bin/python -m neural_lam.split_datastore --source_config_path
      /dcai/projects/cu_0003/user_space/has/git-repos/mllam/mllam-exps-ShCu3/data/datastore.cropped.yaml
      --interior_config_path 
      /dcai/projects/cu_0003/user_space/has/git-repos/mllam/mllam-exps-ShCu3/data/datastore.interior.yaml
      --boundary_config_path 
      /dcai/projects/cu_0003/user_space/has/git-repos/mllam/mllam-exps-ShCu3/data/datastore.boundary.yaml
    deps:
    - path: data/datastore.cropped.yaml
      hash: md5
      md5: f8fa9b788b318738ce6ee30a3895ad01
      size: 8390537
    outs:
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: 3bae39f914be4a7661f0c1ff5313a2d5
      size: 18876878
    - path: data/datastore.interior.yaml
      hash: md5
      md5: 0aec24dcf12debd01405e9c08f187a1f
      size: 15286071
  train:
    cmd:
    - export DVC_WORKING_DIR=$(pwd); sbatch -W --job-name has/LES/dev --time 3-00:00:00
      --nodes 2 --ntasks-per-node 8 --gres gpu:8 --no-requeue --exclusive --mem 2000GB
      --account cu_0003 --chdir ~/logs machines/slurm.neural-lam.sh --config_path
      ./data/config.yaml --logger mlflow --logger-project has/LES/dev --num_workers
      8 --batch_size 1 --hidden_dim 80 --precision bf16-mixed --processor_layers 4
      --model graph_lam --graph triangular --epochs 500 --ar_steps_train 1 --lr 0.001
      --min_lr 0.001 --val_interval 2 --ar_steps_eval 15 --val_steps_to_log 1 2 3
      4 5 6 7 10 --num_sanity_steps 0 --eval_init_times --plot_vars t_2m u_10m v_10m
      pres_sfc --metrics_watch 'val_rmse, mse, random_metric' --num_nodes 2
    deps:
    - path: data/config.yaml
      hash: md5
      md5: fb770049a9f34529539f7469321b8e52
      size: 368
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: 3bae39f914be4a7661f0c1ff5313a2d5
      size: 18876878
    - path: data/datastore.interior.yaml
      hash: md5
      md5: 0aec24dcf12debd01405e9c08f187a1f
      size: 15286071
    - path: data/graph/
      hash: md5
      md5: 73573e4078dd3d286b6ad77a00492305.dir
      size: 233805012
      nfiles: 9
    - path: version.mllam.txt
      hash: md5
      md5: d03a8d7953fe639d93c5d57409e9b956
      size: 30
    outs:
    - path: saved_models
      hash: md5
      md5: c849d6a629d6111bfc8835f3ab692f6d.dir
      size: 2088214830
      nfiles: 83
  evaluate:
    cmd:
    - LASTCHECKPT=`find ./saved_models -maxdepth 1 -type d ! -name '.' -exec stat
      --format='%n' {} + | sort -n | tail -n 1`; export DVC_WORKING_DIR=$(pwd); sbatch
      -W --job-name has/LES/dev --time 1-00:00:00 --nodes 1 --ntasks-per-node 8 --gres
      gpu:8 --no-requeue --exclusive --mem 2000GB --account cu_0003 --chdir ~/logs
      machines/slurm.neural-lam.sh --config_path ./data/config.yaml --eval val --load
      ${LASTCHECKPT}/last.ckpt --logger mlflow --logger-project has/LES/dev --num_workers
      8 --batch_size 1 --hidden_dim 32 --precision bf16-mixed --processor_layers 4
      --model graph_lam --graph triangular --epochs 150 --ar_steps_train 1 --lr 0.0001
      --min_lr 0.0001 --val_interval 2 --ar_steps_eval 15 --val_steps_to_log 1 2 --restore_opt
      --num_sanity_steps 0 --eval_init_times --plot_vars t_2m u_10m v_10m pres_sfc
      --metrics_watch 'val_rmse, mse, random_metric' --num_nodes 1
    deps:
    - path: data/config.yaml
      hash: md5
      md5: fb770049a9f34529539f7469321b8e52
      size: 368
      isexec: true
    - path: data/graph/
      hash: md5
      md5: de02504daf2dc35c0c778b9a7e75a331.dir
      size: 192885716
      nfiles: 9
    - path: saved_models
      hash: md5
      md5: 115858b095e933e203a9f788a216a6f5.dir
      size: 263305096
      nfiles: 11
    - path: version.mllam.txt
      hash: md5
      md5: d03a8d7953fe639d93c5d57409e9b956
      size: 30
      isexec: true
    outs:
    - path: mlruns
      hash: md5
      md5: 9a4af803ef5a91d97dc59f549615f65f.dir
      size: 243482860
      nfiles: 74
  create_graph:
    cmd: export DVC_WORKING_DIR=$(pwd); sbatch -W --chdir ~/logs machines/slurm.graph-creation.sh
      --config_path data/config.yaml --splits 12 --g2m_radius 1.5 --graph_name triangular
    deps:
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: 3bae39f914be4a7661f0c1ff5313a2d5
      size: 18876878
    - path: data/datastore.interior.yaml
      hash: md5
      md5: 0aec24dcf12debd01405e9c08f187a1f
      size: 15286071
    - path: data/semaphore.lsm.created
      hash: md5
      md5: d41d8cd98f00b204e9800998ecf8427e
      size: 0
    outs:
    - path: data/datastore.boundary.zarr
      hash: md5
      md5: 2b971154b790d539849dcfc5ef535c5b.dir
      size: 10600243817
      nfiles: 5641
    - path: data/datastore.interior.zarr
      hash: md5
      md5: 4a758c2d6de07df80518a319cbf62825.dir
      size: 46082954761
      nfiles: 5630
    - path: data/graph/
      hash: md5
      md5: 73573e4078dd3d286b6ad77a00492305.dir
      size: 233805012
      nfiles: 9
