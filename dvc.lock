schema: '2.0'
stages:
  check_for_venv_path:
    cmd: machines/check_for_venv_path.sh
  mllam_version:
    cmd: uv run --reinstall-package neural-lam --reinstall-package 
      mllam-data-prep python -c "from neural_lam import __version__; 
      print(__version__)" > version.mllam.txt; if grep -qi "dirty" 
      version.mllam.txt; then echo "version.mllam.txt contains dirty" >&2; fi
  create_lsm_dataset:
    cmd: uv run python src/create_state_dataset.py --input 
      /home/has/data//sources/icon/ICON312_v1.0.0.zarr --output 
      /home/has/data//sources/icon/ICON312_lsm.zarr; touch 
      data/semaphore.lsm.created
    deps:
    - path: src/create_state_dataset.py
      hash: md5
      md5: 8df2e88394035681bccaaecf404caf0d
      size: 1249
    outs:
    - path: data/semaphore.lsm.created
      hash: md5
      md5: d41d8cd98f00b204e9800998ecf8427e
      size: 0
  split_dataset:
    cmd: $MLLAM_VENV_PATH/bin/python -m neural_lam.split_datastore 
      --source_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.cropped.yaml
      --interior_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.interior.yaml
      --boundary_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.boundary.yaml
    deps:
    - path: data/datastore.cropped.yaml
      hash: md5
      md5: 23d8dea9707bb93db56fe9359eae0913
      size: 8390583
    outs:
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: dd9c71744f4809991c1b8d03d35fa421
      size: 18876913
    - path: data/datastore.interior.yaml
      hash: md5
      md5: ebf2956648478d7d85fab5765f600ade
      size: 15286117
  train:
    cmd:
    - export DVC_WORKING_DIR=$(pwd); bash machines/slurm.neural-lam.sh 
      --config_paths $(python -c "import yaml; 
      d=yaml.safe_load(open('params.yaml'))['mllam-data-prep']['domains']; 
      print(','.join([f'./data/config.{k}.yaml' for k in d]))") --logger mlflow 
      --logger-project has/LES/hi_lam_200_ckptfalse --num_workers 4 --batch_size
      1 --hidden_dim 200 --hidden_dim_grid 200 --precision bf16-mixed 
      --processor_layers 2 --model hi_lam --mesh_aggr mean --epochs 50 
      --ar_steps_train 1 --num_future_boundary_steps 0 --num_past_boundary_steps
      2 --lr 0.001 --min_lr 1e-05 --val_interval 5 --ar_steps_eval 5 
      --val_steps_to_log 1 2 3 4 5 --num_sanity_steps 1 --eval_init_times 
      --plot_vars t_2m u_10m v_10m pres_sfc tqc_dia --metrics_watch 'val_rmse, 
      mse, random_metric' --num_nodes 1 --graph_names $(python -c "import yaml; 
      d=yaml.safe_load(open('params.yaml'))['mllam-data-prep']['domains']; 
      print(','.join([f'triangular2D_split{yaml.safe_load(open('params.yaml'))['graph-defaults']['splits']}_{k}_hierarchical'
      for k in d]))")
    deps:
    - path: data/experiment/
      hash: md5
      md5: b045e259b503136a1a313dfee34b2c08.dir
      size: 140657059892
      nfiles: 39191
    - path: data/graph/
      hash: md5
      md5: 09ee3c2570f51d83d01bf0ca14ab0ea4.dir
      size: 2356389965
      nfiles: 269
    - path: version.mllam.txt
      hash: md5
      md5: b413acdc846c6c2732c0844f55383e59
      size: 33
    outs:
    - path: saved_models
      hash: md5
      md5: 4de8ffb349f286e1226781fb9a3f8ba7.dir
      size: 21009441273
      nfiles: 235
  evaluate:
    cmd:
    - LASTCHECKPT=./saved_models/train-glare-newt/; export 
      DVC_WORKING_DIR=$(pwd); bash machines/slurm.neural-lam.sh --config_path 
      ./data/config.yaml --eval val --load ${LASTCHECKPT}/last.ckpt --logger 
      mlflow --logger-project has/LES/hi_lam_200_ckptfalse --num_workers 4 
      --batch_size 1 --hidden_dim 200 --hidden_dim_grid 200 --precision 
      bf16-mixed --processor_layers 2 --model hi_lam --mesh_aggr mean --epochs 
      50 --ar_steps_train 1 --num_future_boundary_steps 0 
      --num_past_boundary_steps 2 --lr 0.001 --min_lr 1e-05 --val_interval 5 
      --ar_steps_eval 5 --val_steps_to_log 1 2 3 4 5 --num_sanity_steps 1 
      --eval_init_times --plot_vars t_2m u_10m v_10m pres_sfc tqc_dia 
      --metrics_watch 'val_rmse, mse, random_metric' --num_nodes 1
    deps:
    - path: saved_models
      hash: md5
      md5: 4de8ffb349f286e1226781fb9a3f8ba7.dir
      size: 21009441273
      nfiles: 235
    outs:
    - path: mlruns
      hash: md5
      md5: a804dd2825e19d38718ffb19ad0ed7ff.dir
      size: 3135239003
      nfiles: 195
  create_graph:
    cmd: export DVC_WORKING_DIR=$(pwd); uv run python -m 
      neural_lam.build_triangular_graph --config_path data/config.yaml --splits 
      13 --g2m_radius 0.8 --g2m_radius_boundary 0.8 --rotate_ico --levels 3 
      --hierarchical --two_dim_features --graph_names 
      triangular2D_split13_DOM03_hierarchical
    deps:
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: f2a872652d64ea61c220e65ab839f3b2
      size: 2545
    - path: data/datastore.interior.yaml
      hash: md5
      md5: 01c1de550286b9a01c023f39acaad371
      size: 8391506
    - path: data/semaphore.lsm.created
      hash: md5
      md5: d41d8cd98f00b204e9800998ecf8427e
      size: 0
    outs:
    - path: data/datastore.boundary.zarr
      hash: md5
      md5: d77643f89ca6a09f6d41a841029b3c1a.dir
      size: 12448839676
      nfiles: 5623
    - path: data/datastore.interior.zarr
