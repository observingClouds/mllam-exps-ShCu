schema: '2.0'
stages:
  check_for_venv_path:
    cmd: machines/check_for_venv_path.sh
  mllam_version:
    cmd: $MLLAM_VENV_PATH/bin/python -c "from neural_lam import __version__; 
      print(__version__)" > version.mllam.txt
  create_lsm_dataset:
    cmd: $MLLAM_VENV_PATH/bin/python src/create_state_dataset.py --input 
      /home/has/data//sources/icon/ICON312_v1.0.0.zarr --output 
      /home/has/data//sources/icon/ICON312_lsm.zarr; touch 
      data/semaphore.lsm.created
    outs:
    - path: data/semaphore.lsm.created
      hash: md5
      md5: d41d8cd98f00b204e9800998ecf8427e
      size: 0
  split_dataset:
    cmd: $MLLAM_VENV_PATH/bin/python -m neural_lam.split_datastore 
      --source_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.cropped.yaml
      --interior_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.interior.yaml
      --boundary_config_path 
      /leonardo/home/userexternal/hschulz0/repos/mllam-exps-ShCu//data/datastore.boundary.yaml
    deps:
    - path: data/datastore.cropped.yaml
      hash: md5
      md5: 23d8dea9707bb93db56fe9359eae0913
      size: 8390583
    outs:
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: dd9c71744f4809991c1b8d03d35fa421
      size: 18876913
    - path: data/datastore.interior.yaml
      hash: md5
      md5: ebf2956648478d7d85fab5765f600ade
      size: 15286117
  train:
    cmd:
    - export DVC_WORKING_DIR=$(pwd); bash machines/slurm.neural-lam.sh 
      --config_path ./data/config.yaml --logger mlflow --logger-project 
      has/LES/dev --num_workers 4 --batch_size 1 --hidden_dim 40 --precision 
      bf16-mixed --processor_layers 4 --model graph_lam --graph triangulartest 
      --epochs 1 --ar_steps_train 2 --lr 0.01 --min_lr 0.01 --val_interval 5 
      --ar_steps_eval 10 --val_steps_to_log 1 2 3 4 5 6 7 10 --num_sanity_steps 
      1 --eval_init_times --plot_vars t_2m u_10m v_10m pres_sfc --metrics_watch 
      'val_rmse, mse, random_metric' --num_nodes 1
    deps:
    - path: data/config.yaml
      hash: md5
      md5: e24d3be6fee8fdfa3e36d04e9065521f
      size: 290
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: 484992b7d856f5a83d39b316f8967ce6
      size: 1686
    - path: data/datastore.interior.yaml
      hash: md5
      md5: d410160027f57b4404296fb746830b18
      size: 8390180
    - path: data/graph/
      hash: md5
      md5: b150c1074a84d5cfe23cbebe62504bc7.dir
      size: 385097394
      nfiles: 18
    - path: version.mllam.txt
      hash: md5
      md5: e704daffe4e36699770f5fd4bc16b5fa
      size: 20
    outs:
    - path: saved_models
      hash: md5
      md5: 4c586f9449072668f6634e85871bf722.dir
      size: 55675608
      nfiles: 12
  evaluate:
    cmd:
    - LASTCHECKPT=./saved_models/train-glary-tegu/; export 
      DVC_WORKING_DIR=$(pwd); bash machines/slurm.neural-lam.sh --config_path 
      ./data/config.yaml --eval val --load ${LASTCHECKPT}/last.ckpt --logger 
      mlflow --logger-project has/LES/dev --num_workers 4 --batch_size 1 
      --hidden_dim 40 --precision bf16-mixed --processor_layers 4 --model 
      graph_lam --graph triangulartest --epochs 1 --ar_steps_train 2 --lr 0.01 
      --min_lr 0.01 --val_interval 5 --ar_steps_eval 10 --val_steps_to_log 1 2 3
      4 5 6 7 10 --num_sanity_steps 1 --eval_init_times --plot_vars t_2m u_10m 
      v_10m pres_sfc --metrics_watch 'val_rmse, mse, random_metric' --num_nodes 
      1
    deps:
    - path: data/config.yaml
      hash: md5
      md5: e24d3be6fee8fdfa3e36d04e9065521f
      size: 290
    - path: data/graph/
      hash: md5
      md5: b150c1074a84d5cfe23cbebe62504bc7.dir
      size: 385097394
      nfiles: 18
    - path: saved_models
      hash: md5
      md5: 8c14d7fc12e62e7a7e5f5b644dfe7889.dir
      size: 53233979
      nfiles: 11
    - path: version.mllam.txt
      hash: md5
      md5: e704daffe4e36699770f5fd4bc16b5fa
      size: 20
    outs:
    - path: mlruns
      hash: md5
      md5: 9387c33c6bcdb867e792995d7b9941fb.dir
      size: 15417394
      nfiles: 47
  create_graph:
    cmd: export DVC_WORKING_DIR=$(pwd); uv run python -m 
      neural_lam.build_triangular_graph --config_path data/config.yaml --splits 
      12 --g2m_radius 1.5 --graph_name triangulartest
    deps:
    - path: data/datastore.boundary.yaml
      hash: md5
      md5: 484992b7d856f5a83d39b316f8967ce6
      size: 1686
    - path: data/datastore.interior.yaml
      hash: md5
      md5: d410160027f57b4404296fb746830b18
      size: 8390180
    - path: data/semaphore.lsm.created
      hash: md5
      md5: d41d8cd98f00b204e9800998ecf8427e
      size: 0
    outs:
    - path: data/datastore.boundary.zarr
      hash: md5
      md5: 79f5c64d256764088e745cf96a408b88.dir
      size: 8895645853
      nfiles: 5623
    - path: data/datastore.interior.zarr
      hash: md5
      md5: 7303696bf442da9daa827c213da516aa.dir
      size: 41337680655
      nfiles: 5621
    - path: data/graph/
      hash: md5
      md5: b150c1074a84d5cfe23cbebe62504bc7.dir
      size: 385097394
      nfiles: 18
  get_grid_information:
    cmd: $MLLAM_VENV_PATH/bin/python src/attach_grid.py
    outs:
    - path: data/grid.zarr
      hash: md5
      md5: 75339de88651f78f27758319b285c250.dir
      size: 334935821
      nfiles: 99
