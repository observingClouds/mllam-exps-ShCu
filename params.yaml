# This file contains parameters that are tracked by DVC.
# 
# Notes:
# - YAML anchor (`&<alias>`) and aliases (`*<alias>`) can be used to define an
#     "anchor"-value that can aliased (referenced) somewhere else in the
#     yaml-file, thereby avoiding redundancy
# - YAML overwrites (`<<: *<alias>`) are used to insert default parameters into specific
#     parameter sections and overwrite specific keys there
# - Parameters set in this file are unpacked in `dvc.yaml` with e.g. ${baseline-defaults}
#     resulting in each key being prepended with `--` making it possible to pass them as
#     command line arguments to neural-lam
#     (https://dvc.org/doc/user-guide/project-structure/dvcyaml-files#dictionary-unpacking)

# the name of the "experiment" on mlflow that your run(s) will be grouped under
# change this to something that describes what you'll be working on (for
# example what the parameter study is about)
logger-project: &logger-project has/LES/hi_lam_200_ckptfalse

graph-defaults:
  splits: 13
  g2m_radius: 0.8
  g2m_radius_boundary: 0.8
  rotate_ico: true
  levels: 3
  plot: false
  hierarchical: true
  two_dim_features: true

mllam-data-prep:
  domains:
  - domain03
  boundary-input-variables:
  - u_10m
  - v_10m
  - qv_2m
  - tqc_dia
  - t_2m
  - lhfl_s
  - shfl_s
  - rain_gsp_rate
  - pres_sfc
  - t_seasfc
  - sob_t
  - thb_t
  interior-input-variables:
  - u_10m
  - v_10m
  - qv_2m
  - tqc_dia
  - t_2m
  - lhfl_s
  - shfl_s
  - rain_gsp_rate
  - pres_sfc
  - sob_t
  - thb_t
baseline-defaults: &baseline-defaults
                                       # defaults across training and evaluation stage, which get passed to python -m neural_lam.train_model
  num_workers: 4
  batch_size: 1
  hidden_dim: 200
  hidden_dim_grid: 200
  grad_checkpointing: false
  precision: bf16-mixed
  processor_layers: 2
  model: hi_lam
  mesh_aggr: mean
  seed: 11
  epochs: 50
  ar_steps_train: 1
  num_future_boundary_steps: 0
  num_past_boundary_steps: 2
  lr: 0.001
  min_lr: 0.00001
  val_interval: 5
  ar_steps_eval: 5
  val_steps_to_log:
  - 1
  - 2
  - 3
  - 4
  - 5
  restore_opt: false
  num_sanity_steps: 1
  eval_init_times: true  # work around to remove eval_init_times
  plot_vars:
  - u_10m
  - qv_2m
  metrics_watch: val_rmse, mse, random_metric
  num_nodes: &num_nodes 1  # creating a YAML anchor that is referenced also in the SLURM directives so only needs to be defined here

baseline-eval:
  <<: *baseline-defaults
                                   # insert all parameters set in baseline-defaults
  num_nodes: &num_nodes_eval 1     # and overwrite the num_nodes parameter to make it evaluation stage specific

  num_workers: 4
  batch_size: 1
  hidden_dim: 200
  hidden_dim_grid: 200
  grad_checkpointing: false
  precision: bf16-mixed
  processor_layers: 2
  model: hi_lam
  mesh_aggr: mean
  epochs: 50
  ar_steps_train: 1
  num_future_boundary_steps: 0
  num_past_boundary_steps: 2
  lr: 0.001
  min_lr: 0.00001
  val_interval: 5
  ar_steps_eval: 5
  val_steps_to_log:
  - 1
  - 2
  - 3
  - 4
  - 5
  restore_opt: false
  num_sanity_steps: 1
  eval_init_times: true
  plot_vars:
  - u_10m
  - qv_2m
  metrics_watch: val_rmse, mse, random_metric
  seed: 10
slurm-defaults: &slurm-defaults
                                   # SLURM directives, which gets passed to sbatch
  job-name: *logger-project
  time: 00:30:00
  nodes: *num_nodes
                                   # set in baseline-defaults section above and referenced here via alias
  ntasks-per-node: 4
  gres: gpu:4  #per node
  no-requeue: true                 # becomes `--no-requeue`
  exclusive: true
  mem: 100GB
  account: deste_330_25
  partition: boost_usr_prod
  qos: boost_qos_dbg               # see https://wiki.u-gov.it/confluence/display/SCAIUS/Booster+Section

slurm-eval:                        # Overwriting SLURM defaults with evaluation stage specifics
  <<: *slurm-defaults
  nodes: *num_nodes_eval
  job-name: *logger-project
  time: 00:30:00
  ntasks-per-node: 1
  gres: gpu:1
  no-requeue: true
  exclusive: true
  mem: 100GB
  account: deste_330_25
  partition: boost_usr_prod
  qos: boost_qos_dbg

slurm-graph:
  job-name: *logger-project
  time: 24:00:00
  nodes: *num_nodes
  gres: gpu:0
  mem: 300GB
  account: deste_330_25
  partition: boost_usr_prod
  qos: normal
  ntasks-per-node: 1
seed: 11
